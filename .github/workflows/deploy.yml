name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          echo "Deploy triggered for commit ${{ github.sha }}"
          echo "Railway auto-deploys on push to main via the railway.toml config."
          echo "Configure RAILWAY_TOKEN secret to enable CLI-based deploys if needed."